sim:
  device: cuda:0
  dt: 0.008333333333333333
  gravity: !!python/tuple
  - 0.0
  - 0.0
  - -9.81
  physics_prim_path: /physicsScene
  physics_material:
    func: isaaclab.sim.spawners.materials.physics_materials:spawn_rigid_body_material
    static_friction: 0.5
    dynamic_friction: 0.5
    restitution: 0.0
    density: null
    _usd_applied_schema: null
    _usd_field_exceptions: {}
    _usd_namespace: physics
  use_fabric: true
  render_interval: 4
  enable_scene_query_support: false
  use_newton_actuators: true
  physics:
    class_type: isaaclab_contrib.coupling.coupler:NewtonCouplerManager
    deterministic: false
    num_substeps: 2
    collision_decimation: 0
    debug_mode: false
    use_cuda_graph: true
    deterministic_mode: not_guaranteed
    solver_cfg:
      class_type: isaaclab_contrib.coupling.coupler:NewtonCouplerManager
      solver_type: None
      entries:
      - name: rigid
        solver_cfg:
          class_type: isaaclab_newton.physics.mjwarp_manager:NewtonMJWarpManager
          solver_type: mujoco_warp
          njmax: 300
          nconmax: null
          iterations: 100
          ls_iterations: 30
          solver: newton
          integrator: implicitfast
          use_mujoco_cpu: false
          disable_contacts: false
          disable_sensors: false
          default_actuator_gear: null
          actuator_gears: null
          update_data_interval: 1
          save_to_mjcf: null
          impratio: 1.0
          cone: elliptic
          ccd_iterations: 35
          ls_parallel: false
          use_mujoco_contacts: true
          tolerance: 1.0e-06
        bodies:
        - /World/envs/env_[^/]+/Robot
        particles: []
        all_particles: false
        include_child_joints: true
        include_body_shapes: true
        include_static_shapes: false
        shape_label_patterns: []
        substeps: 1
        in_place: false
      - name: soft
        solver_cfg:
          class_type: isaaclab_newton.physics.vbd_manager:NewtonVBDManager
          solver_type: None
          iterations: 10
          integrate_with_external_rigid_solver: false
          particle_enable_self_contact: false
          particle_self_contact_radius: 0.005
          particle_self_contact_margin: 0.005
          particle_collision_detection_interval: -1
          particle_vertex_contact_buffer_size: 32
          particle_edge_contact_buffer_size: 64
          particle_topological_contact_filter_threshold: 2
          particle_rest_shape_contact_exclusion_radius: 0.0
          rigid_contact_k_start: 100.0
          rigid_body_particle_contact_buffer_size: 1024
        bodies: []
        particles: []
        all_particles: true
        include_child_joints: true
        include_body_shapes: true
        include_static_shapes: true
        shape_label_patterns: []
        substeps: 1
        in_place: false
      proxies:
      - source: rigid
        destination: soft
        bodies:
        - 8
        - 9
        - 10
        - 19
        - 20
        - 21
        - 30
        - 31
        - 32
        - 41
        - 42
        - 43
        particles: []
        mode: lagged
        mass_scale: 1.0
        collide_interval: 1
        collision_pipeline:
          broad_phase: explicit
          reduce_contacts: true
          rigid_contact_max: null
          max_triangle_pairs: 1000000
          soft_contact_max: null
          soft_contact_margin: 0.01
          enable_rigid_soft_full_surface_contact: true
          requires_grad: null
          sdf_hydroelastic_config: null
      iterations: 1
    soft_contact_cfg:
      soft_contact_ke: 8000.0
      soft_contact_kd: 0.01
      soft_contact_mu: 10.0
    collision_cfg: null
    default_shape_cfg:
      margin: 0.0
      gap: 0.01
      ke: 2500.0
      kd: 100.0
      mu: 1.0
    load_visual_shapes: null
    bvh_constructor_geometry: cubql
    bvh_constructor_scene: sah
    bvh_constructor_gaussian: cubql
  create_stage_in_memory: false
  logging_level: WARNING
  save_logs_to_file: true
  log_dir: null
  visualizer_cfgs:
  - class_type: isaaclab_visualizers.kit.kit_visualizer:KitVisualizer
    eye: !!python/tuple
